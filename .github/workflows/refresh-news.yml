name: Refresh news briefs

# Backup only: the briefs are now written for free every morning by a scheduled Claude task
# (see brief-server/scripts/morning-briefs.mjs). This paid version runs only when started by hand
# from the Actions tab, and each run spends Claude API credit (about 55 cents a brief).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these tickers, like MSFT,SP500 (leave empty for all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: brief-server
      - run: node scripts/refresh-news.mjs
        working-directory: brief-server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
      - name: Save the new briefs
        run: |
          if git diff --quiet -- data/news.json; then echo "No change"; exit 0; fi
          git config user.name "wvfc-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Refresh news briefs"
          git pull --rebase origin main
          git push
