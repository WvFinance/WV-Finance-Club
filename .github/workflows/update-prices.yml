name: Update prices

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays after the market closes (4:30pm Eastern in winter)
  push:
    branches: [main]
    paths: [data/portfolio.json, scripts/update_prices.py, .github/workflows/update-prices.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/update_prices.py
      - name: Save the new prices
        run: |
          if git diff --quiet -- data/prices.json; then echo "No change"; exit 0; fi
          git config user.name "wvfc-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Update closing prices"
          git push
