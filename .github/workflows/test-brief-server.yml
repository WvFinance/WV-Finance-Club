name: Test brief server

# Asks the brief server for one brief and prints it. Free (uses one of the day's free Gemini briefs).
# The run turns red if no brief comes back, and the result shows at the top of the run page.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Stock to test, like NASDAQ:AMD"
        default: "NASDAQ:AMD"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ask for a brief
        run: |
          code=$(curl -sS -m 180 -o brief.json -w '%{http_code}' \
            -H "Origin: https://wvfinance.github.io" \
            "https://wvfc-brief-server.wvfinance.workers.dev/brief?symbol=${{ inputs.symbol }}")
          cat brief.json; echo; echo "HTTP $code"
          msg=$(node -e 'const b=JSON.parse(require("fs").readFileSync("brief.json","utf8"));console.log(b.error?"Error: "+b.error+(b.reason?" ("+b.reason+")":""):`${b.headline} (${b.sentiment}, ${(b.sources||[]).length} sources: ${[...new Set((b.sources||[]).map(s=>s.outlet))].join(", ")})`)' 2>/dev/null || echo "Unreadable reply")
          words=$(node --input-type=module -e 'import { gradeLevel, unexplainedJargon } from "./brief-server/src/wording.js"; import fs from "fs"; const b = JSON.parse(fs.readFileSync("brief.json", "utf8")); if (b.summary) { const t = [b.summary, ...b.bull, ...b.bear].join(" "); const j = unexplainedJargon([b.headline, t].join(" ")); console.log(`Reading level: grade ${gradeLevel(t).toFixed(1)}. Unexplained jargon: ${j.length ? j.join(", ") : "none"}.`); }' 2>/dev/null)
          [ -n "$words" ] && echo "::notice title=Wording::$words"
          if [ "$code" = 200 ]; then echo "::notice title=Brief OK::$msg"; else echo "::error title=HTTP $code::$msg"; exit 1; fi
      - name: Check the brief through simplestreet.com.co
        if: always()
        run: |
          # The site asks for briefs at simplestreet.com.co/api. The brief above is saved for a day,
          # so this just reads it back (free) and proves the website's address reaches the server.
          code=$(curl -sS -m 60 -o site.json -w '%{http_code}' -H "Origin: https://simplestreet.com.co" -D site-headers.txt \
            "https://simplestreet.com.co/api/brief?symbol=${{ inputs.symbol }}")
          allow=$(grep -i '^access-control-allow-origin' site-headers.txt | tr -d '\r' | cut -d' ' -f2)
          msg=$(node -e 'const b=JSON.parse(require("fs").readFileSync("site.json","utf8"));console.log(b.error?"Error: "+b.error:b.headline)' 2>/dev/null || echo "Not a brief (the /api route may be broken)")
          echo "HTTP $code, allowed origin: $allow: $msg"
          if [ "$code" = 200 ] && [ "$allow" = "https://simplestreet.com.co" ]; then echo "::notice title=simplestreet.com.co OK::$msg"; else echo "::error title=simplestreet.com.co HTTP $code (origin $allow)::$msg"; exit 1; fi
      - name: Check the news feeds
        if: always()
        run: |
          r=$(curl -sS -m 60 "https://wvfc-brief-server.wvfinance.workers.dev/news-check?symbol=${{ inputs.symbol }}")
          echo "$r"; echo "::notice title=News feeds::$r"
      - name: Check the Congress trades for the Feed page
        if: always()
        run: |
          code=$(curl -sS -m 60 -o congress.json -w '%{http_code}' -H "Origin: https://wvfinance.github.io" "https://wvfc-brief-server.wvfinance.workers.dev/congress")
          r=$(node -e 'const j=JSON.parse(require("fs").readFileSync("congress.json","utf8"));const t=j.trades||[];console.log(j.error?"Error: "+j.error+(j.reason?" ("+j.reason+")":""):`${t.length} trades, newest reported ${t.map(x=>x.reported).sort().pop()}, checked ${j.checked}${j.stale?" (old copy)":""}`)' 2>/dev/null || echo "Unreadable reply")
          echo "HTTP $code: $r"; echo "::notice title=Congress trades::HTTP $code: $r"
