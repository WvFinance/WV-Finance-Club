name = "wvfc-brief-server"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Saved briefs, so each stock is only written once a day.
# Create it with: npx wrangler kv namespace create BRIEFS  (then paste the id here)
[[kv_namespaces]]
binding = "BRIEFS"
id = "REPLACE_WITH_KV_ID"

[vars]
ALLOWED_ORIGIN = "https://wvfinance.github.io"
# Most new briefs the server will write in one day. Saved briefs don't count.
DAILY_LIMIT = "40"
# Most new briefs one internet address can ask for in a day (a whole school shares one address).
VISITOR_LIMIT = "25"
# Most /news-check test calls per day.
CHECK_LIMIT = "30"
# Free Google Gemini model that writes the briefs (free tier, without Google Search).
GEMINI_MODEL = "gemini-3.5-flash-lite"

# The Gemini API key is a secret, never put it in this file.
# It comes from the GEMINI_API_KEY GitHub secret when the deploy workflow runs.
